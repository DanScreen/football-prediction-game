name: Deploy

on:
  push:
    branches: [main]

env:
  PROJECT_ID: football-prediction-app-499513
  REGION: europe-west2
  SERVICE: football-prediction-app
  REGISTRY: europe-west2-docker.pkg.dev
  REPOSITORY: football-prediction-app
  # Public URL — a Cloudflare Worker proxies this domain to the Cloud Run service
  # (europe-west2 doesn't support Cloud Run domain mappings). See cloudflare/worker.js.
  APP_URL: https://scorersonline.uk

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the deploy on the test suite — nothing reaches prod that's red.
      # Tests import types from the generated client, so generate it first.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npx vitest run

      # The mobile app ships from this repo but has its own lockfile, so it is
      # invisible to `npm ci` above. Gate the deploy on it compiling: `main`
      # once carried a mobile app that did not typecheck for two weeks.
      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci

      - name: Typecheck mobile app
        run: npm run mobile:typecheck

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Run database migrations
        run: |
          curl -sLo cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.13.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy "${{ secrets.CLOUD_SQL_INSTANCE }}" &
          PROXY_PID=$!
          sleep 5
          DATABASE_URL="${{ secrets.DB_MIGRATION_URL }}" npx prisma migrate deploy
          kill $PROXY_PID

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/app:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --platform managed \
            --service-account "${{ secrets.CLOUD_RUN_SA }}" \
            --add-cloudsql-instances "${{ secrets.CLOUD_SQL_INSTANCE }}" \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "FOOTBALL_DATA_API_KEY=${{ secrets.FOOTBALL_DATA_API_KEY }}" \
            --set-env-vars "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" \
            --set-env-vars "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" \
            --set-env-vars "CRON_SECRET=${{ secrets.CRON_SECRET }}" \
            --set-env-vars "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" \
            --set-env-vars "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" \
            --set-env-vars "AUTH_URL=${{ env.APP_URL }}" \
            --set-env-vars "^|^SITE_ADMIN_EMAILS=${{ secrets.SITE_ADMIN_EMAILS }}" \
            --min-instances 0 \
            --max-instances 3 \
            --allow-unauthenticated \
            --quiet
